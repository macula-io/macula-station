name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.macula.io
  IMAGE_NAME: registry.macula.io/macula-station

jobs:
  build:
    name: Build + test (OTP ${{ matrix.otp }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.0']
    container:
      image: docker.io/library/erlang:27.0

    steps:
      # erlang:27.0 is distroless of node; checkout@v4 is a JS action and
      # needs node in $PATH. Install once at the top.
      - name: Bootstrap node + git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs git ca-certificates curl

      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install rebar3
        run: |
          curl -L -o /usr/local/bin/rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x /usr/local/bin/rebar3
          rebar3 version

      - name: Cache _build
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('**/rebar.config', '**/rebar.lock', '**/*.app.src') }}

      - name: Compile
        run: rebar3 compile

      - name: Xref
        run: rebar3 xref

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct || true

      - name: Dialyzer
        run: rebar3 dialyzer

  docker:
    name: Build + push Docker image
    # `host` executor (declared in beam02-builder config.yaml) — runs
    # directly on the host so we have access to the docker daemon for
    # buildx. Other jobs use the docker executor (containerised).
    runs-on: host
    needs: build
    if: github.event_name == 'push'

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Log in to registry.macula.io
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MACULA_REGISTRY_USER }}
          password: ${{ secrets.MACULA_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
