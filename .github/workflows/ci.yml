name: CI

# Push to main → :main + :<sha> (amd64 only, fast)
# Push to tag  → :vX.Y.Z + :vX.Y + :latest (multi-arch amd64+arm64)
#
# Container target: ghcr.io/macula-io/macula-station
# Moved off codeberg.org 2026-07-26: GitHub is canonical, and the Codeberg
# registry is scheduled for deletion. Keeping rollback artifacts (every
# :<sha> tag) in a registry we intend to destroy meant the fleet's entire
# recovery surface was accumulating somewhere it would vanish.
# Auth: the built-in GITHUB_TOKEN, so there is no publisher secret to rotate.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# GITHUB_TOKEN needs packages:write to push to ghcr, and it is not granted
# by default under restricted default permissions.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/macula-io/macula-station

jobs:
  build:
    name: Build + test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['28.1']

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}

      # rebar3 installed manually — setup-beam's rebar3-version lookup
      # keeps failing on the GitHub releases pagination cap. Pulling the
      # canonical S3 binary works regardless of action quirks.
      - name: Install rebar3
        run: |
          curl -L -o rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          sudo mv rebar3 /usr/local/bin/rebar3
          rebar3 version

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('**/rebar.config', '**/rebar.lock', '**/*.app.src') }}

      # rebar.lock is deliberately gitignored (this repo floats on `~>`
      # ranges, not exact pins), so the cache key above can't reflect
      # which hex release actually satisfies a dependency's constraint —
      # it only changes when rebar.config/.app.src text changes. Without
      # this step, a cache hit skips dependency resolution entirely and
      # silently keeps building against whatever was cached the last time
      # the key changed, even after a new hex release ships. Confirmed
      # live 2026-08-20: three straight pushes built and xref-failed
      # against a macula 9.1.1 cached from hours earlier, while 9.3.0 and
      # 9.3.1 had already been published and satisfied the same "~> 9.1"
      # constraint the whole time.
      - name: Upgrade deps to latest matching version
        run: rebar3 upgrade --all

      - name: Compile
        run: rebar3 compile

      - name: Xref
        run: rebar3 xref

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct

      - name: Dialyzer
        run: rebar3 dialyzer

  build-amd64:
    name: Build + push image (amd64)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},suffix=-amd64,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          provenance: false

  build-arm64:
    name: Build + push image (arm64)
    runs-on: ubuntu-22.04-arm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-arm64

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          provenance: false

  manifest:
    name: Create multi-arch manifest (tag only)
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success'

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create and push manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="${{ env.IMAGE_NAME }}"

          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${VERSION}"

          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:latest"

          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          docker manifest create "${IMAGE}:${MAJOR_MINOR}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker manifest push "${IMAGE}:${MAJOR_MINOR}"
