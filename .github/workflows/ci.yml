name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/hecate-social/hecate-station

jobs:
  build:
    name: Build + test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['27.0']
        rebar3: ['latest']

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Erlang/OTP + rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('**/rebar.config', '**/rebar.lock', '**/*.app.src') }}
          # No `restore-keys' — partial fallback restores stale
          # `_build/default/lib/macula' from before a rebar.lock bump
          # (rebar3 doesn't re-fetch deps when source is already
          # present, so a stale dep silently sticks around). Only
          # exact key matches; cold-cache on miss is the cost.

      - name: Compile
        run: rebar3 compile

      - name: Xref
        run: rebar3 xref

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct || true   # no CT suites yet — Phase 1 adds first suite

      - name: Dialyzer
        run: rebar3 dialyzer

  docker:
    name: Build + push Docker image
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
