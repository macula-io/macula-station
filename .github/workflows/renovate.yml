name: Renovate

# Self-hosted Renovate: runs on GitHub Actions against THIS repo. Keeps
# the `macula` SDK family in lock-step with hex.pm and auto-merges the
# bump on green (config lives in-repo: renovate.json5).
#
# ⚠ It pointed at Codeberg until 2026-08-13, months after GitHub became
# canonical, and so failed on EVERY scheduled run from 2026-08-08
# onward — dying in 6 to 15 seconds against an endpoint it could no
# longer authenticate to. Nothing watched the schedule, so the repo
# believed it had dependency automation while having none: the macula
# 7.1 -> 8.0 bump had to be found and made by hand.
#
# Requires a repo Actions secret RENOVATE_TOKEN — a GITHUB personal
# access token (classic, `repo` scope, or fine-grained with Contents
# read+write and Pull requests read+write on this repo) so Renovate can
# push the branch, open the PR and enable auto-merge. The built-in
# GITHUB_TOKEN is deliberately NOT used: PRs it opens do not trigger
# workflow runs, so auto-merge-on-green would wait for a check that
# never starts.

on:
  schedule:
    - cron: "17 5 * * *"   # daily ~05:17 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        default: "info"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v41
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: macula-io/macula-station
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@users.noreply.github.com>"
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
