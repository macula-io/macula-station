name: Renovate

# Self-hosted Renovate: runs on GitHub Actions (where CI already lives)
# but operates against the canonical Codeberg repo. Keeps the `macula`
# SDK family in lock-step with hex.pm and auto-merges the bump on green
# (config lives in-repo: renovate.json5).
#
# Requires a repo Actions secret RENOVATE_TOKEN — a Codeberg personal
# access token with read+write `repository`, `issue` and `pull request`
# scopes for this repo, so Renovate can push the branch, open the PR,
# and enable auto-merge.

on:
  schedule:
    - cron: "17 5 * * *"   # daily ~05:17 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        default: "info"

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v41
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://codeberg.org
          RENOVATE_REPOSITORIES: macula-internal/macula-station
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@users.noreply.codeberg.org>"
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
